name: Daily Legal Data Sync Worker

on:
  schedule:
    # 19:00 UTC = 02:00 AM (Asia/Ho_Chi_Minh) ngày hôm sau
    - cron: '0 19 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  run-sync-worker:
    runs-on: [self-hosted, thueradar-sync]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Sync Worker
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/sync-worker.mjs --manual
          else
            node scripts/sync-worker.mjs --scheduled
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_ACCESS_APPROVED: "1"
          SYNC_TIMEZONE: "Asia/Ho_Chi_Minh"
          SYNC_SCHEDULE_HOUR: "2"
          CRAWLER_TIMEOUT_MS: "60000"
          CRAWLER_RETRIES: "2"
          NODE_OPTIONS: "--use-system-ca"