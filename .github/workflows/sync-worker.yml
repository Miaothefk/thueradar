name: Daily Legal Data Sync Worker

on:
  schedule:
    # 19:00 UTC = 02:00 AM (Asia/Ho_Chi_Minh) ngày hôm sau
    - cron: '0 19 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  run-sync-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Sync Worker
        run: node scripts/sync-worker.mjs --scheduled
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_ACCESS_APPROVED: "1"
          SYNC_TIMEZONE: "Asia/Ho_Chi_Minh"
          SYNC_SCHEDULE_HOUR: "2"